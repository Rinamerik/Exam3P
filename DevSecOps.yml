name: DevSecOps Pipeline


on:
  push: 
    branches: main
  pull_request:
    branches: main

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: SAST (Semgrep)
        run: |
          pip install semgrep
          semgrep scan --config auto --error
      - name: Secret scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        
